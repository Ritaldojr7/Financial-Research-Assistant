services:
  - type: web
    name: financial-research-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: financial-research
      - key: API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: 1
